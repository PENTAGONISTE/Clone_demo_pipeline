[project]
name = "biblio"
version = "1.4.2"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: base de données réelle (Docker requis)",
  "e2e: navigateur piloté par Playwright",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
